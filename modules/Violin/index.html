<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Violin Plot</title>
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<nav class="navbar">
<a href="../../">首页</a>
<a href="../RNAseq/">RNA-seq</a>
<a href="../WGS/">WGS</a>
</nav>
<div class="container">
<h1>📊 多基因表达小提琴图</h1>
<div class="panel">
<h3>输入 Gene ID</h3>
<textarea id="genes" placeholder="TGGT1_240690
TGGT1_289300"></textarea>
</div>
<div class="panel">
<h3>上传表达矩阵</h3>
<input id="expressionFile" type="file">
</div>
<button onclick="runViolin()">生成图像</button>
<div class="result" id="result">等待生成</div>
</div>
<script src="../../assets/app.js"></script>
<script>
async function runViolin(){
let genes=document.getElementById('genes').value;
let file=document.getElementById('expressionFile').files[0];
if(!genes || !file){
alert('请输入Gene ID并上传表达矩阵');
return;
}
document.getElementById('result').innerHTML='正在提交分析任务...';
let form=new FormData();
form.append('file',file);
form.append('genes',genes);
try{
let r=await fetch('http://127.0.0.1:8765/upload',{method:'POST',body:form});
let d=await r.json();
document.getElementById('result').innerHTML='上传完成，等待绘图任务';
}catch(e){
document.getElementById('result').innerHTML='请先启动 BioSeq 本地服务';
}
}
</script>
</body>
</html>
