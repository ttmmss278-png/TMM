<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>WGS Analysis</title>
<link rel="stylesheet" href="../../assets/style.css">
<script src="../../assets/app.js"></script>
</head>
<body>
<div class="main">
<div class="header">
<h2>🧬 全基因组测序分析</h2>
<p>FASTQ → 质量控制 → 比对 → BAM → 变异分析</p>
</div>

<div class="panel">
<h3>1. 上传测序数据</h3>
<p>请选择双端测序 FASTQ 文件</p>
<input id="fastqFiles" type="file" multiple>
<button onclick="uploadFiles(document.getElementById('fastqFiles').files)">上传数据</button>
</div>

<div class="panel">
<h3>2. 分析参数</h3>
<input id="geneID" placeholder="目标基因 TGGT1_xxxxxx">
</div>

<button onclick="runWGS()">开始分析</button>

<div class="result">
等待分析
</div>

</div>
</body>
</html>
