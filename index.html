<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BioSeq Analysis Platform</title>
<style>
body{font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f7fb;margin:0;color:#1f2937}
.container{max-width:1100px;margin:40px auto;padding:20px}
h1{text-align:center;font-size:36px}.sub{text-align:center;color:#64748b;margin-bottom:40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.card{background:white;border-radius:16px;padding:30px;box-shadow:0 8px 25px rgba(0,0,0,.08);cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-5px)}.card h2{font-size:22px}.card p{line-height:1.7;color:#475569}
.tag{display:inline-block;background:#e0f2fe;padding:5px 12px;border-radius:20px;font-size:14px}
.footer{text-align:center;margin-top:50px;color:#64748b}
</style>
</head>
<body>
<div class="container">
<h1>BioSeq Analysis Platform</h1>
<div class="sub">生物测序数据自动分析与可视化工作平台</div>
<div class="grid">
<div class="card">
<span class="tag">WGS</span>
<h2>🧬 全基因组测序分析</h2>
<p>用于基因组测序数据分析框架。后续接入质量控制、比对、SNP检测、注释等R分析流程。</p>
</div>
<div class="card">
<span class="tag">RNA-seq</span>
<h2>🧬 转录组测序分析</h2>
<p>包含火山图、气泡图、热图等分析模块。支持项目文件夹自动识别分析文件。</p>
</div>
<div class="card">
<span class="tag">Visualization</span>
<h2>📊 小提琴图绘制</h2>
<p>上传表达矩阵文件，输入一个或多个基因编号，调用R脚本自动绘制表达分布图。</p>
</div>
</div>
<div class="footer">Version 1.0 | R analysis interface reserved</div>
</div>
</body>
</html>
