<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>WGS分析</title>
<link rel="stylesheet" href="../assets/style.css">
<script src="../assets/app.js"></script>
</head>
<body>
<div class="container">
<h1>🧬 全基因组测序分析 <span style="font-size:14px;color:#666">BioSeq WGS v1.0</span></h1>

<div class="panel">
<h3>1. 上传FASTQ数据</h3>
<p>请选择双端测序 FASTQ 文件</p>
<input type="file" id="fastqFiles" multiple>
<button onclick="uploadWGSFiles()">上传数据</button>
</div>

<div class="panel">
<h3>2. 目标基因</h3>
<input id="geneID" placeholder="例如 TGGT1_xxxxxx">
</div>

<div class="panel">
<h3>3. 分析流程</h3>
<p>FASTQ → fastp → BWA → samtools → BAM/BAI → IGV</p>
</div>

<button onclick="runWGS()">开始分析</button>

<div class="result" id="result">等待分析</div>
</div>

<script>
async function uploadWGSFiles(){
 let files=document.getElementById('fastqFiles').files;
 let d=await uploadFiles(files);
 document.getElementById('result').innerHTML='文件上传完成，共 '+(d.files?d.files.length:0)+' 个文件';
}

async function runWGS(){
 await runAnalysis('wgs');
}
</script>
</body>
</html>
