<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>RNA-seq分析</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="container">
<h1>🧬 转录组测序分析工作台</h1>

<div class="panel">
<h3>1. 上传RNA-seq项目文件</h3>
<input id="rnaFiles" type="file" webkitdirectory multiple>
<button onclick="uploadRNA()">上传并识别文件</button>
</div>

<div class="panel">
<h3>2. 文件识别结果</h3>
<div id="scanResult">等待扫描...</div>
</div>

<div class="panel">
<h3>3. 分析模块</h3>
<button onclick="runRNA('volcano')">📈 火山图</button>
<button onclick="runRNA('bubble')">🫧 气泡图</button>
<button onclick="runRNA('heatmap')">🔥 热图</button>
</div>

<div class="result">等待运行结果</div>
</div>
<script src="../assets/app.js"></script>
<script>
let rnaPath='';
async function uploadRNA(){
 let files=document.getElementById('rnaFiles').files;
 let form=new FormData();
 for(let f of files){form.append('files',f)}
 let r=await fetch('http://127.0.0.1:8765/upload',{method:'POST',body:form});
 let d=await r.json();
 rnaPath=d.files[0]||'';
 document.getElementById('scanResult').innerHTML='文件上传完成：'+d.files.length+' 个文件';
}
function runRNA(m){runAnalysis(m,rnaPath)}
</script>
</body>
</html>
